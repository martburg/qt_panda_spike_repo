[tool.ruff]
line-length = 120
target-version = "py311"

# Only tooling config; no packaging config is defined.
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "B",  # flake8-bugbear
]
ignore = [
  "E501", # line length handled separately
]

[tool.ruff.lint.isort]
known-first-party = ["steuerung3d"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[stack]
name = "dev_sim"

[rig]
# Axis IDs to boot. Keep this explicit; do not derive implicitly from joy2intent.
axes = ["Anton", "Debby", "Cecil", "Burt"]
device_source = "sim"  # sim | real

[net]
bind_host = "127.0.0.1"
cmd_base = 52001
ui_telem_base = 51002
dev_telem_in = "127.0.0.1:52020"
status_in = "127.0.0.1:51200"  # supervisor birds-eye heartbeat
raw_in = "127.0.0.1:50100"      # inputd -> joy2intent
intent = "127.0.0.1:51001"  # joy2intent -> core

[services.core]
enabled = true
module = "steuerung3d.apps.core_udp_service"
mode = "single"
args = [
  "--intent-in", "{net.intent}",
  "--dev-telem-in", "{net.dev_telem_in}",
  "--dev-cmd-base", "{net.cmd_base}",
  "--dev-cmd-count", "{len(rig.axes)}",
  "--ui-telem-base", "{net.ui_telem_base}",
  "--ui-telem-count", "{len(rig.axes)}",
  "{repeat('--axis', rig.axes)}",
]

[services.densi]
enabled = true
module = "steuerung3d.apps.den_si"
mode = "per_axis"
config = "configs/services/densi.toml"
args = [
  "--axis", "{axis}",
  "--cmd-in", "{net.bind_host}:{net.cmd_base + axis_index}",
  "--telem-out", "{net.dev_telem_in}",
]

[services.hip]
enabled = true
module = "steuerung3d.apps.hi_p"
mode = "single"
count = "auto"  # one HiP window per axis (unattached by default)
config = "configs/services/hip.toml"
args = [
  "--telem-in", "{net.bind_host}:{net.ui_telem_base}",
  "--intent-out", "{net.intent}",
]

[services.inputd]
enabled = true
module = "steuerung3d.apps.inputd"
mode = "single"
config = "configs/inputd_gamepad.toml"

[services.joy2intent]
enabled = true
module = "steuerung3d.apps.joy2intent"
mode = "single"
config = "configs/joy2intent_bindings_gamepad.toml"
args = [
  "--raw-in", "{net.raw_in}",
  "--intent-out", "{net.intent}",
  "--winches", "{csv(rig.axes)}",
]

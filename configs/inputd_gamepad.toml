[io]
# UDP target for RawControls samples
out = "127.0.0.1:50100"
# Sampling rate (Hz). 50-100 Hz is a good default.
tick_hz = 60

[device]
# Pick by index (use: python -m steuerung3d.apps.inputd --list)
index = 0

# Or pick by substring in device name (case-insensitive)
# name_contains = "Xbox"

# Source label included in RawControls
src = "gamepad0"

[options]
# Convert D-pad hats to 4 virtual buttons per hat (up,down,left,right)
hat_as_buttons = true

# Optionally cap reported axes/buttons (useful if a device exposes lots).
# Leave max_buttons unset when you want joy2intent to see every available physical button.
# max_axes = 8
# max_buttons = 16

[normalize]
# Optional per-axis inversion. Keys are axis indices (as strings).
# Example: invert axis 1 (often Y) so up is positive
invert_axes = { "1" = true }

[filter]
# Optional light filtering at the RawControls stage (can be left 0)
# deadzone/expo are typically handled in the joy2intent mapping layer.
deadzone = 0.0
expo = 0.0
# Exponential smoothing alpha in [0..1]. 0 disables.
smoothing_alpha = 0.0

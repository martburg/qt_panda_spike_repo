[stack]
name = "dev_sim_c2"

[rig]
# SIM stack: 4 simulated devices, 2 operator stations consuming C2.
axes = ["Anton", "Debby", "Cecil", "Burt"]
device_source = "sim"

[net]
bind_host = "127.0.0.1"
cmd_base = 52001
ui_telem_base = 51002
# C2 rig telemetry (unicast fanout)
c2_telem_pilot = "127.0.0.1:51100"
c2_telem_ft = "127.0.0.1:51101"

dev_telem_in = "127.0.0.1:52020"
status_in = "127.0.0.1:51200"
raw_in = "127.0.0.1:50100"
intent = "127.0.0.1:51001"

[services.core]
enabled = true
module = "steuerung3d.apps.core_udp_service"
mode = "single"
args = [
  "--intent-in", "{net.intent}",
  "--dev-telem-in", "{net.dev_telem_in}",
  "--dev-cmd-base", "{net.cmd_base}",
  "--dev-cmd-count", "{len(rig.axes)}",
  "--ui-telem-base", "{net.ui_telem_base}",
  "--ui-telem-count", "{len(rig.axes)}",
  "--c2-telem-target", "{net.c2_telem_pilot}",
  "--c2-telem-target", "{net.c2_telem_ft}",
  "{repeat('--axis', rig.axes)}",
]

[services.densi]
enabled = true
module = "steuerung3d.apps.den_si"
mode = "per_axis"
config = "configs/services/densi.toml"
args = [
  "--axis", "{axis}",
  "--cmd-in", "{net.bind_host}:{net.cmd_base + axis_index}",
  "--telem-out", "{net.dev_telem_in}",
]

[services.hip_pilot]
enabled = true
module = "steuerung3d.apps.hi_p"
mode = "single"
config = "configs/services/hip.toml"
args = [
  "--role", "pilot",
  "--telem-in", "{net.c2_telem_pilot}",
  "--intent-out", "{net.intent}",
]

[services.hip_ft]
enabled = true
module = "steuerung3d.apps.hi_p"
mode = "single"
config = "configs/services/hip.toml"
args = [
  "--role", "ft",
  "--telem-in", "{net.c2_telem_ft}",
  "--intent-out", "{net.intent}",
]

[services.inputd]
enabled = true
module = "steuerung3d.apps.inputd"
mode = "single"
config = "configs/inputd_gamepad.toml"

[services.joy2intent]
enabled = true
module = "steuerung3d.apps.joy2intent"
mode = "single"
config = "configs/services/joy2intent.toml"
args = [
  "--raw-in", "{net.raw_in}",
  "--intent-out", "{net.intent}",
  "--winches", "{csv(rig.axes)}",
]

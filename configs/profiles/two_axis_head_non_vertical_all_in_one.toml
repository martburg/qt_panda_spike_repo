[stack]
name = "two_axis_head_non_vertical_all_in_one"

[rig]
axes = ["HeadJoint1", "HeadJoint2"]
device_source = "sim"

[net]
bind_host = "127.0.0.1"
cmd_base = 52011
ui_telem_base = 51002
dev_telem_in = "127.0.0.1:52020"
raw_in = "127.0.0.1:50100"
intent = "127.0.0.1:51001"

[services.core]
enabled = true
module = "steuerung3d.apps.core_udp_service"
mode = "single"
args = [
  "--intent-in", "{net.intent}",
  "--dev-telem-in", "{net.dev_telem_in}",
  "--dev-cmd-base", "{net.cmd_base}",
  "--dev-cmd-count", "{len(rig.axes)}",
  "--ui-telem-mode", "fanout",
  "--ui-telem-base", "{net.ui_telem_base}",
  "--ui-telem-count", "1",
  "{repeat('--axis', rig.axes)}",
]

[services.densi]
enabled = true
module = "steuerung3d.apps.den_si"
mode = "per_axis"
config = "configs/services/densi.toml"
args = [
  "--axis", "{axis}",
  "--cmd-in", "{net.bind_host}:{net.cmd_base + axis_index}",
  "--telem-out", "{net.dev_telem_in}",
  "--action-in", "{net.bind_host}:{53001 + axis_index}",
]

[services.inputd]
enabled = true
module = "steuerung3d.apps.inputd"
mode = "single"
config = "configs/inputd_gamepad.toml"

[services.joy2intent]
enabled = true
module = "steuerung3d.apps.joy2intent"
mode = "single"
config = "configs/services/joy2intent_two_axis_head.toml"
args = [
  "--raw-in", "{net.raw_in}",
  "--intent-out", "{net.intent}",
]

[services.supervisor]
enabled = true
module = "steuerung3d"
mode = "single"
args = [
  "sup",
  "--profile",
  "configs/supervisor/smoke_two_axis_head_non_vertical_embedded.toml",
]
